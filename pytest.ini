[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Pruebas unitarias (sin servicios externos)
    integration: Pruebas de integración (requieren Docker)
    performance: Pruebas de rendimiento (requieren Docker + Ollama)
    slow: Pruebas lentas (>5 seg)
