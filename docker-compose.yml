# ═══════════════════════════════════════════════════════════════
# Arquitectura multi-servicio (agentes basados en microservicios)
# ───────────────────────────────────────────────────────────────
#  · Orquestador STATELESS (LangGraph supervisor, interrupt + eventos)
#  · Agentes como microservicios independientes (event-driven)
#  · Tools-as-a-Service: 6 microservicios (1 por herramienta)
#  · LLM Gateway centralizado (LB, reintentos, fallback, caché)
#  · Estado en Redis (checkpoints + task store) y PostgreSQL
#    (datos de negocio + historial de chat)
#  · Bus de eventos: RabbitMQ (agent.task.triggered/completed, …)
# ═══════════════════════════════════════════════════════════════

x-tool-urls: &tool-urls
  TOOL_URLS: '{"client":"http://tool-client:8010","trends":"http://tool-trends:8011","competitors":"http://tool-competitors:8012","rag":"http://tool-rag:8013","news":"http://tool-news:8014","trending":"http://tool-trending:8015","postiz":"http://tool-postiz:8016"}'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ideation_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./migrations/001_multi_tenant_foundation.sql:/docker-entrypoint-initdb.d/zz_multi_tenant_foundation.sql
      - ./migrations/002_brand_knowledge_and_channels.sql:/docker-entrypoint-initdb.d/zzz_brand_knowledge_and_channels.sql
      - ./migrations/003_publication_platform.sql:/docker-entrypoint-initdb.d/zzzz_publication_platform.sql
      - ./migrations/004_idea_generation_batches.sql:/docker-entrypoint-initdb.d/zzzzz_idea_generation_batches.sql
      - ./migrations/005_brand_scoped_idea_batches.sql:/docker-entrypoint-initdb.d/zzzzzz_brand_scoped_idea_batches.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ideation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Stack: checkpoints de LangGraph (RedisJSON + RediSearch),
  # TaskStore del orquestador y caché de prompts del LLM Gateway.
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LLM Gateway (centralización de LLM) ─────────────────────
  llm-gateway:
    build:
      context: .
      dockerfile: llm_gateway/Dockerfile
    ports:
      - "8003:8003"
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: "11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-mistral-nemo}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  # ── Tools-as-a-Service (6 microservicios) ───────────────────
  tool-client:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_client
    ports:
      - "8010:8010"
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  tool-trends:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_trends
    ports:
      - "8011:8011"
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    restart: on-failure

  tool-competitors:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_competitors
    ports:
      - "8012:8012"
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    restart: on-failure

  tool-rag:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_rag
    ports:
      - "8013:8013"
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    restart: on-failure

  tool-news:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_news
    ports:
      - "8014:8014"
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  tool-trending:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_trending
    ports:
      - "8015:8015"
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      LLM_GATEWAY_URL: http://llm-gateway:8003
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  tool-postiz:
    build:
      context: .
      dockerfile: tool_services/Dockerfile
      args:
        TOOL_DIR: tool_postiz
    ports:
      - "8016:8016"
    environment:
      POSTIZ_API_URL: ${POSTIZ_API_URL:-https://api.postiz.com/public/v1}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY:-}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # ── Agentes (microservicios independientes) ─────────────────
  agente-ideacion:
    build:
      context: .
      dockerfile: agente_ideacion/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_URL: redis://redis:6379
      LLM_GATEWAY_URL: http://llm-gateway:8003
      <<: *tool-urls
    restart: on-failure

  agente-publicacion:
    build:
      context: .
      dockerfile: agente_publicacion/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      tool-postiz:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_URL: redis://redis:6379
      LLM_GATEWAY_URL: http://llm-gateway:8003
      <<: *tool-urls
    restart: on-failure

  # ── Orquestador STATELESS ───────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_started
      tool-rag:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      LLM_GATEWAY_URL: http://llm-gateway:8003
      <<: *tool-urls
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
