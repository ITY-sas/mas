version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ideation_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

  agente-ideacion:
    build: ./agente_ideacion
    depends_on:
      - rabbitmq
      - postgres
      - ollama
    environment:
      RABBITMQ_HOST: rabbitmq
      POSTGRES_HOST: postgres
      OLLAMA_HOST: ollama

  agente-publicacion:
    build: ./agente_publicacion
    depends_on:
      - rabbitmq
      - postgres
      - ollama
    environment:
      RABBITMQ_HOST: rabbitmq
      POSTGRES_HOST: postgres
      OLLAMA_HOST: ollama
